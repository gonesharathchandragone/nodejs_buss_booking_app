<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎬 Movie Booking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #0f1117; color: #e6e6e6; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a1c2c, #2d1b3d);
    padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  header h1 { font-size: 22px; cursor: pointer; }
  header h1 span { color: #ff5c8a; }

  .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
  h2 { margin-bottom: 16px; font-size: 22px; }

  /* Movies */
  .movies { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .movie {
    background: #1a1d2b; border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform .2s, box-shadow .2s; border: 1px solid #2a2d3d;
  }
  .movie:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(255,92,138,.2); }
  .movie img { width: 100%; height: 280px; object-fit: cover; }
  .movie-info { padding: 12px; }
  .movie-info h3 { font-size: 16px; margin-bottom: 4px; }
  .movie-info p { font-size: 13px; color: #9aa0b0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px;
    background: #ff5c8a22; color: #ff5c8a; font-size: 12px; margin-top: 6px; }

  /* Buttons */
  .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
    background: #ff5c8a; color: #fff; font-size: 14px; font-weight: 600; }
  .btn:hover { background: #e04a76; }
  .btn:disabled { background: #444; cursor: not-allowed; }
  .back { background: none; border: 1px solid #444; color: #e6e6e6;
    padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
  .back:hover { background: #222; }

  /* Booking view */
  .movie-header { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .movie-header img { width: 120px; border-radius: 10px; }
  .showtimes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .showtime { padding: 8px 14px; border-radius: 8px; border: 1px solid #333;
    background: #1a1d2b; cursor: pointer; color: #e6e6e6; font-size: 14px; }
  .showtime.active { background: #ff5c8a; border-color: #ff5c8a; color: #fff; }

  .screen { background: linear-gradient(180deg,#2a2d3d,transparent); height: 36px;
    margin: 24px auto 12px; max-width: 480px; border-radius: 50% 50% 0 0;
    text-align: center; color: #9aa0b0; font-size: 11px; padding-top: 6px; letter-spacing: 4px; }

  .seats { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-bottom: 20px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row-label { width: 18px; color: #666; font-size: 12px; }
  .seat { width: 26px; height: 26px; border-radius: 6px; background: #2a2d3d;
    cursor: pointer; border: 1px solid #333; transition: background .15s; }
  .seat:hover:not(.booked) { background: #3a3d5d; }
  .seat.selected { background: #ff5c8a; border-color: #ff5c8a; }
  .seat.booked { background: #444; cursor: not-allowed; opacity: .4; }
  .seat.premium { border-color: #ffb84d; }
  .seat.premium.selected { background: #ffb84d; }

  .summary { background: #1a1d2b; border-radius: 12px; padding: 20px;
    max-width: 480px; margin: 0 auto; }
  .summary h3 { margin-bottom: 12px; }
  .line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .total { border-top: 1px solid #333; margin-top: 8px; padding-top: 12px; font-weight: bold; }

  .form { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .form input { padding: 10px; border-radius: 8px; border: 1px solid #333;
    background: #0f1117; color: #e6e6e6; font-size: 14px; }
  .form input:focus { outline: none; border-color: #ff5c8a; }

  .confirm { text-align: center; max-width: 480px; margin: 40px auto; }
  .confirm .check { font-size: 60px; }
  .confirm h2 { color: #4ade80; margin: 12px 0; }
  .confirm p { color: #9aa0b0; font-size: 14px; margin-bottom: 6px; }
  .booking-id { background: #1a1d2b; padding: 12px; border-radius: 8px;
    font-family: monospace; margin: 16px 0; color: #ff5c8a; word-break: break-all; }

  .lookup input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
    background: #1a1d2b; color: #e6e6e6; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 onclick="showMovies()">🎬 Cine<span>Book</span></h1>
  <button class="back" onclick="showLookup()">My Booking</button>
</header>

<main class="container">
  <!-- Movies -->
  <section id="moviesView">
    <h2>Now Showing</h2>
    <div class="movies" id="moviesGrid">Loading...</div>
  </section>

  <!-- Booking -->
  <section id="bookingView" class="hidden">
    <button class="back" onclick="showMovies()">← Back</button>
    <div class="movie-header" id="movieHeader"></div>
    <div class="screen">SCREEN</div>
    <div class="seats" id="seatsGrid"></div>

    <div class="summary">
      <h3>Booking Summary</h3>
      <div class="line"><span>Seats</span><span id="sumSeats">None</span></div>
      <div class="line"><span>Showtime</span><span id="sumTime">—</span></div>
      <div class="line total"><span>Total</span><span id="sumTotal">$0</span></div>

      <div class="form" id="form" style="display:none;">
        <input id="nameInput" placeholder="Your Name *" />
        <input id="emailInput" type="email" placeholder="Email *" />
        <button class="btn" onclick="submitBooking()">Confirm Booking</button>
      </div>
    </div>
  </section>

  <!-- Confirmation -->
  <section id="confirmView" class="hidden">
    <div class="confirm">
      <div class="check">✅</div>
      <h2>Booking Confirmed!</h2>
      <p id="confirmMovie"></p>
      <p id="confirmSeats"></p>
      <div class="booking-id" id="confirmId"></div>
      <button class="btn" onclick="showMovies()">Book Another</button>
    </div>
  </section>

  <!-- Lookup -->
  <section id="lookupView" class="hidden">
    <button class="back" onclick="showMovies()">← Back</button>
    <h2>Find My Booking</h2>
    <div class="lookup">
      <input id="lookupId" placeholder="Enter booking ID" />
      <button class="btn" onclick="findBooking()">Search</button>
      <div id="lookupResult" style="margin-top:16px;"></div>
    </div>
  </section>
</main>

<script>
let movies = [];
let currentMovie = null;
let currentShowtime = null;
let selectedSeats = [];
let currentPrice = 0;

const hideAll = () => ["moviesView","bookingView","confirmView","lookupView"]
  .forEach(id => document.getElementById(id).classList.add("hidden"));

async function showMovies() {
  hideAll();
  document.getElementById("moviesView").classList.remove("hidden");
  const res = await fetch("/api/movies");
  movies = await res.json();
  document.getElementById("moviesGrid").innerHTML = movies.map(m => `
    <div class="movie" onclick="showBooking(${m.id})">
      <img src="${m.poster}" onerror="this.src='https://via.placeholder.com/300x450?text=${encodeURIComponent(m.title)}'" />
      <div class="movie-info">
        <h3>${m.title}</h3>
        <p>${m.genre} · ${m.duration} min</p>
        <span class="badge">$${m.price}</span>
      </div>
    </div>
  `).join("");
}

function showBooking(id) {
  currentMovie = movies.find(m => m.id === id);
  currentShowtime = null;
  selectedSeats = [];
  hideAll();
  document.getElementById("bookingView").classList.remove("hidden");
  renderHeader();
  document.getElementById("seatsGrid").innerHTML = `<p style="color:#9aa0b0;font-size:14px;">Select a showtime.</p>`;
  updateSummary();
}

function renderHeader() {
  document.getElementById("movieHeader").innerHTML = `
    <img src="${currentMovie.poster}" onerror="this.src='https://via.placeholder.com/120x180'" />
    <div>
      <h3>${currentMovie.title}</h3>
      <p style="color:#9aa0b0;font-size:14px;margin-top:6px;">${currentMovie.genre} · ${currentMovie.duration} min · $${currentMovie.price}/seat</p>
      <p style="margin-top:12px;font-size:14px;">Choose a showtime:</p>
      <div class="showtimes">
        ${currentMovie.showtimes.map(t => `
          <button class="showtime ${t===currentShowtime?'active':''}" onclick="selectShowtime('${t}')">${t}</button>
        `).join("")}
      </div>
    </div>
  `;
}

async function selectShowtime(t) {
  currentShowtime = t;
  selectedSeats = [];
  renderHeader();
  await loadSeats();
}

async function loadSeats() {
  const res = await fetch(`/api/movies/${currentMovie.id}/seats?showtime=${encodeURIComponent(currentShowtime)}`);
  const { seats, price } = await res.json();
  currentPrice = price;

  const rows = {};
  seats.forEach(s => (rows[s.row] = rows[s.row] || []).push(s));

  document.getElementById("seatsGrid").innerHTML = Object.keys(rows).map(row => `
    <div class="row">
      <span class="row-label">${row}</span>
      ${rows[row].map(s => `
        <div class="seat ${s.booked?'booked':''} ${s.premium?'premium':''} ${selectedSeats.includes(s.id)?'selected':''}"
             onclick="toggleSeat('${s.id}', ${s.booked})" title="${s.id}"></div>
      `).join("")}
    </div>
  `).join("");

  updateSummary();
}

function toggleSeat(id, booked) {
  if (booked) return;
  if (selectedSeats.includes(id)) selectedSeats = selectedSeats.filter(s => s !== id);
  else if (selectedSeats.length < 8) selectedSeats.push(id);
  else return alert("Max 8 seats per booking");
  loadSeats();
}

function updateSummary() {
  document.getElementById("sumSeats").textContent = selectedSeats.length ? selectedSeats.join(", ") : "None";
  document.getElementById("sumTime").textContent = currentShowtime || "—";
  document.getElementById("sumTotal").textContent = `$${selectedSeats.length * currentPrice}`;
  document.getElementById("form").style.display =
    selectedSeats.length && currentShowtime ? "flex" : "none";
}

async function submitBooking() {
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  if (!name) return alert("Enter your name");
  if (!email) return alert("Enter your email");

  const res = await fetch("/api/bookings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      movieId: currentMovie.id,
      showtime: currentShowtime,
      seats: selectedSeats,
      name,
      email,
    }),
  });

  const data = await res.json();
  if (!res.ok) return alert(data.error || "Booking failed");

  hideAll();
  document.getElementById("confirmView").classList.remove("hidden");
  document.getElementById("confirmMovie").textContent = `${data.movieTitle} — ${data.showtime}`;
  document.getElementById("confirmSeats").textContent = `Seats: ${data.seats.join(", ")} | Total: $${data.total}`;
  document.getElementById("confirmId").textContent = data.id;
}

function showLookup() {
  hideAll();
  document.getElementById("lookupView").classList.remove("hidden");
  document.getElementById("lookupResult").innerHTML = "";
  document.getElementById("lookupId").value = "";
}

async function findBooking() {
  const id = document.getElementById("lookupId").value.trim();
  const result = document.getElementById("lookupResult");
  if (!id) return;

  const res = await fetch(`/api/bookings/${encodeURIComponent(id)}`);
  if (!res.ok) return (result.innerHTML = `<p style="color:#ff6b6b;">Booking not found.</p>`);

  const b = await res.json();
  result.innerHTML = `
    <div class="summary">
      <h3>${b.movieTitle}</h3>
      <div class="line"><span>Showtime</span><span>${b.showtime}</span></div>
      <div class="line"><span>Seats</span><span>${b.seats.join(", ")}</span></div>
      <div class="line"><span>Name</span><span>${b.name}</span></div>
      <div class="line"><span>Email</span><span>${b.email}</span></div>
      <div class="line total"><span>Total</span><span>$${b.total}</span></div>
    </div>
  `;
}

showMovies();
</script>
</body>
</html>
